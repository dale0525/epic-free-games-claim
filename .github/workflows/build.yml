name: Build extensions

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wxt-dev-wxt/package-lock.json

      - name: Install dependencies
        working-directory: wxt-dev-wxt
        run: npm ci

      - name: Build Chrome extension
        working-directory: wxt-dev-wxt
        run: npx wxt build --browser=chrome

      - name: Build Firefox extension
        working-directory: wxt-dev-wxt
        run: npx wxt build -b firefox --mv3

      - name: Package extensions
        working-directory: wxt-dev-wxt
        run: |
          npx wxt zip --browser=chrome
          npx wxt zip -b firefox

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: extensions-${{ github.sha }}
          path: wxt-dev-wxt/dist/*.zip
          if-no-files-found: error
          retention-days: 30
